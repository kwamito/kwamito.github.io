<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="680" height="400" viewBox="0 0 680 400" role="img" aria-labelledby="nk-04-ligature-title nk-04-ligature-desc">
<title id="nk-04-ligature-title">Ligature</title><desc id="nk-04-ligature-desc">Interactive initials logo concept for Nana Kwame. Hover to see subtle motion.</desc>
<style>
      .ink{fill:#18352d}.green{fill:#238463}.mint{fill:#a9dfc3}.gold{fill:#c49a53}
      .stroke-ink{stroke:#18352d}.stroke-green{stroke:#238463}.stroke-gold{stroke:#c49a53}
      .move,.draw,.spin,.pulse{transform-box:fill-box;transform-origin:center;transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .45s ease,stroke-dashoffset 1s ease}
      svg:hover .move{transform:translateY(-7px)}
      svg:hover .spin{transform:rotate(24deg)}
      svg:hover .pulse{transform:scale(1.12)}
      svg:hover .draw{stroke-dashoffset:0!important}
      @media (prefers-reduced-motion:reduce){.move,.draw,.spin,.pulse{transition:none!important}}
      
    </style>

<g fill="none" stroke="#18352d" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" class="move">
<path d="M161 288V112L286 288V112"/><path d="M286 205H371M371 112V288M371 208L490 112M371 208L490 288"/>
</g><path class="draw" d="M160 318H494" stroke="#c49a53" stroke-width="5" stroke-dasharray="334" stroke-dashoffset="334"/>
<circle class="gold pulse" cx="286" cy="112" r="9"/>

</svg>