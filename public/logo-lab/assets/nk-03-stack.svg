<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="680" height="400" viewBox="0 0 680 400" role="img" aria-labelledby="nk-03-stack-title nk-03-stack-desc">
<title id="nk-03-stack-title">Stack</title><desc id="nk-03-stack-desc">Interactive initials logo concept for Nana Kwame. Hover to see subtle motion.</desc>
<style>
      .ink{fill:#18352d}.green{fill:#238463}.mint{fill:#a9dfc3}.gold{fill:#c49a53}
      .stroke-ink{stroke:#18352d}.stroke-green{stroke:#238463}.stroke-gold{stroke:#c49a53}
      .move,.draw,.spin,.pulse{transform-box:fill-box;transform-origin:center;transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .45s ease,stroke-dashoffset 1s ease}
      svg:hover .move{transform:translateY(-7px)}
      svg:hover .spin{transform:rotate(24deg)}
      svg:hover .pulse{transform:scale(1.12)}
      svg:hover .draw{stroke-dashoffset:0!important}
      @media (prefers-reduced-motion:reduce){.move,.draw,.spin,.pulse{transition:none!important}}
      
    </style>

<g class="move"><rect x="182" y="89" width="316" height="222" rx="24" fill="#18352d"/>
<path d="M222 264V137L314 264V137" fill="none" stroke="#f2f6ef" stroke-width="21" stroke-linejoin="round"/>
<path d="M370 137V264M460 137L370 211L465 264" fill="none" stroke="#a9dfc3" stroke-width="21" stroke-linejoin="round"/>
<path d="M182 272H498" stroke="#238463" stroke-width="10"/></g>

</svg>