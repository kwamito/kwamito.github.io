<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="680" height="400" viewBox="0 0 680 400" role="img" aria-labelledby="name-02-terminal-title name-02-terminal-desc">
<title id="name-02-terminal-title">Terminal</title><desc id="name-02-terminal-desc">Interactive full name logo concept for Nana Kwame. Hover to see subtle motion.</desc>
<style>
      .ink{fill:#18352d}.green{fill:#238463}.mint{fill:#a9dfc3}.gold{fill:#c49a53}
      .stroke-ink{stroke:#18352d}.stroke-green{stroke:#238463}.stroke-gold{stroke:#c49a53}
      .move,.draw,.spin,.pulse{transform-box:fill-box;transform-origin:center;transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .45s ease,stroke-dashoffset 1s ease}
      svg:hover .move{transform:translateY(-7px)}
      svg:hover .spin{transform:rotate(24deg)}
      svg:hover .pulse{transform:scale(1.12)}
      svg:hover .draw{stroke-dashoffset:0!important}
      @media (prefers-reduced-motion:reduce){.move,.draw,.spin,.pulse{transition:none!important}}
      
    </style>

<rect x="83" y="105" width="514" height="190" rx="18" fill="none" stroke="#18352d" stroke-width="4"/>
<circle class="green pulse" cx="119" cy="137" r="7"/><circle cx="143" cy="137" r="7" fill="#a9dfc3"/>
<path d="M83 162H597" stroke="#18352d" stroke-width="3"/>
<text x="116" y="237" class="green" font-family="Menlo,monospace" font-size="54" font-weight="700">&gt;</text>
<text x="161" y="237" class="ink move" font-family="Menlo,monospace" font-size="46" font-weight="700" letter-spacing="-3">nana_kwame</text>
<rect class="pulse" x="510" y="246" width="28" height="5" fill="#238463"/>

</svg>