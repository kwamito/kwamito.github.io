<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="680" height="400" viewBox="0 0 680 400" role="img" aria-labelledby="name-04-keystone-title name-04-keystone-desc">
<title id="name-04-keystone-title">Keystone</title><desc id="name-04-keystone-desc">Interactive full name logo concept for Nana Kwame. Hover to see subtle motion.</desc>
<style>
      .ink{fill:#18352d}.green{fill:#238463}.mint{fill:#a9dfc3}.gold{fill:#c49a53}
      .stroke-ink{stroke:#18352d}.stroke-green{stroke:#238463}.stroke-gold{stroke:#c49a53}
      .move,.draw,.spin,.pulse{transform-box:fill-box;transform-origin:center;transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .45s ease,stroke-dashoffset 1s ease}
      svg:hover .move{transform:translateY(-7px)}
      svg:hover .spin{transform:rotate(24deg)}
      svg:hover .pulse{transform:scale(1.12)}
      svg:hover .draw{stroke-dashoffset:0!important}
      @media (prefers-reduced-motion:reduce){.move,.draw,.spin,.pulse{transition:none!important}}
      
    </style>

<path class="spin" d="M142 143L198 200L142 257L86 200Z" fill="#18352d"/>
<path d="M117 226V175L141 226V175M160 175V226M181 175L160 203L182 226" fill="none" stroke="#a9dfc3" stroke-width="5"/>
<text x="225" y="202" class="ink move" font-family="Georgia,serif" font-size="58" font-weight="700" letter-spacing="-3">Nana Kwame</text>
<text x="229" y="239" class="green" font-family="Arial,sans-serif" font-size="14" letter-spacing="5">BUILT WITH INTENT</text>

</svg>