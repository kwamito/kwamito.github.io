<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="680" height="400" viewBox="0 0 680 400" role="img" aria-labelledby="name-03-axis-title name-03-axis-desc">
<title id="name-03-axis-title">Axis</title><desc id="name-03-axis-desc">Interactive full name logo concept for Nana Kwame. Hover to see subtle motion.</desc>
<style>
      .ink{fill:#18352d}.green{fill:#238463}.mint{fill:#a9dfc3}.gold{fill:#c49a53}
      .stroke-ink{stroke:#18352d}.stroke-green{stroke:#238463}.stroke-gold{stroke:#c49a53}
      .move,.draw,.spin,.pulse{transform-box:fill-box;transform-origin:center;transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .45s ease,stroke-dashoffset 1s ease}
      svg:hover .move{transform:translateY(-7px)}
      svg:hover .spin{transform:rotate(24deg)}
      svg:hover .pulse{transform:scale(1.12)}
      svg:hover .draw{stroke-dashoffset:0!important}
      @media (prefers-reduced-motion:reduce){.move,.draw,.spin,.pulse{transition:none!important}}
      
    </style>

<path d="M122 98V304" stroke="#238463" stroke-width="7"/>
<text x="150" y="184" class="ink move" font-family="Arial,sans-serif" font-size="83" font-weight="800" letter-spacing="-7">NANA</text>
<text x="150" y="271" class="ink move" font-family="Arial,sans-serif" font-size="83" font-weight="800" letter-spacing="-7">KWAME</text>
<path class="draw" d="M475 112L557 112L557 194" fill="none" stroke="#c49a53" stroke-width="5" stroke-dasharray="164" stroke-dashoffset="164"/>

</svg>